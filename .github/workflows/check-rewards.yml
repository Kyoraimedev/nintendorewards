name: Check Nintendo Rewards

on:
  schedule:
    # Toutes les 15 minutes (limite pratique du cron GitHub Actions)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      notify_all_available:
        description: 'Notifier toutes les récompenses actuellement disponibles (test / bootstrap)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Scraper sans envoyer de message Discord ni écrire le state'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nintendo-rewards-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check rewards & notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING_ROLE_ID: '1535705354069876817'
        run: |
          ARGS=""
          if [ "${{ inputs.notify_all_available }}" = "true" ]; then
            ARGS="$ARGS --notify-all-available"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/check-rewards.mjs $ARGS

      - name: Commit updated state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/known-rewards.json
          if git diff --staged --quiet; then
            echo "Aucune modification d'état"
          else
            git commit -m "chore: update known Nintendo rewards state"
            git push
          fi
