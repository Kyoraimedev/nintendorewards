services:
  nintendo-rewards:
    build: .
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      DISCORD_PING_ROLE_ID: ${DISCORD_PING_ROLE_ID:-1535705354069876817}
    volumes:
      # Persiste l'état entre les checks / redeploys
      - nintendo-rewards-data:/app/data

volumes:
  nintendo-rewards-data:
